services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-catalog_db}
      POSTGRES_USER: ${DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalog_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-catalog_user} -d ${DB_NAME:-catalog_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build: .
    container_name: catalog-app
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://catalog-db:5432/${DB_NAME:-catalog_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-catalog_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-catalog_pass}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      catalog-db:
        condition: service_healthy

volumes:
  catalog_pgdata: