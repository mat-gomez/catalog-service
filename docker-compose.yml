services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-catalog_db}
      POSTGRES_USER: ${DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalog_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-catalog_user} -d ${DB_NAME:-catalog_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  catalog_pgdata: